<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Space</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="container">
        <div class="figure">
            <div class="face">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth"></div>
            </div>
            <!-- The arm is now a direct child of container to control its z-index independently -->
        </div>
        <div class="arm left-arm">
            <div class="hand">
                <div class="fingers">
                    <div class="finger"></div>
                    <div class="finger"></div>
                    <div class="finger"></div>
                </div>
            </div>
        </div>
        <div class="table"></div>
        <div class="laptop">
            <div class="laptop-screen">
                <div class="laptop-dot"></div>
            </div>
            <div class="laptop-keyboard"></div>
        </div>
    </div>
</body>
</html>
