name: Deploy Monorepo to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Build google_portfolioChallenge
      - name: Install Portfolio Dependencies
        run: |
          cd google_portfolioChallenge
          npm install

      - name: Build Portfolio
        run: |
          cd google_portfolioChallenge
          npm run build

      # Prepare Artifact Structure
      - name: Prepare Deployment Artifact
        run: |
          mkdir -p _site/portfolio
          # Copy Portfolio build to subfolder
          cp -r google_portfolioChallenge/dist/* _site/portfolio/
          
          # Copy Root index.html and style.css
          cp index.html _site/index.html
          cp style.css _site/style.css
          cp favicon.svg _site/favicon.svg
          
          # Copy Static Sub-Projects
          cp -r CSSArtCompetion _site/
          cp -r FrontEndHalloween _site/
          cp -r JuneCelebration _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
