<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Halloween</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fog-container"></div>
    <div class="container">
        <div class="masking-container">
            <h1 class="masked-text">The Annual Descent into Black Perfection: <br> 365 Days to Midnight.
            <br> Countdown to Halloween </h1>
        </div>

        <div class="matrix-container" id="countdown-matrix-container">
            <div id="countdown" class="matrix-text" data-text=""></div>
            <div class="rain"></div>
        </div>
        <div class="flex-section">
            <div class="ghost-container">
                <div class="pumpkin">
                    <div class="pumpkin-stem"></div>
                    <div class="pumpkin-face">
                        <div class="pumpkin-eye left"></div>
                        <div class="pumpkin-eye right"></div>
                        <div class="pumpkin-mouth"></div>
                    </div>
                <div class="ghost">
                    <div class="ghost-eyes"></div>
                    <div class="ghost-mouth"></div>
                </div>
                </div>
            </div>
            <div id="todo-list-container">
                <h2>Halloween Prep To-Do List</h2>
                <div class="todo-list"></div>
            </div>
        </div>
        <a href="trick-or-treat.html">Trick or Treat</a>
        <audio id="ambient-sound" loop src="sounds/spooky.mp3"></audio>
        <button id="sound-toggle">Toggle Sound</button>
    </div>
    <script src="app.js"></script>
    <br>
    <br>
    <footer>
        <p>&copy; <span id="year"></span> Ulrike Herold. All rights reserved.</p>
        <p>The project was built for the <a href="https://dev.to/devteam/join-our-latest-frontend-challenge-halloween-edition-55oi" target="_blank">DEV Challenge Frontend Challenge: Halloween Edition 🦇</a></p>
    </footer>
</body>
</html>
